<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kate Shelest Photography</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <div id="site-header"></div>

    <!-- Contact form -->
    <main class="container my-5">
        <section class="contact-section">
            <div class="text-center mb-5">
                <h1 class="contact-heading">Let’s Plan Your Photo Session</h1>
                <p class="contact-intro">
                    Tell me about the photography session you are looking for.
                    I will get back to you as soon as possible.
                </p>
            </div>

            <form id="contact-form" class="contact-form" novalidate>
                <div class="row g-4">

                    <div class="col-12 col-md-6">
                        <label for="first-name" class="form-label">First Name</label>
                        <input type="text" id="first-name" name="firstName" class="form-control">
                        <p class="error-message" id="first-name-error"></p>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="last-name" class="form-label">Last Name</label>
                        <input type="text" id="last-name" name="lastName" class="form-control">
                        <p class="error-message" id="last-name-error"></p>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" name="email" class="form-control">
                        <p class="error-message" id="email-error"></p>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control">
                        <p class="error-message" id="phone-error"></p>
                    </div>

                    <div class="col-12">
                        <label for="service" class="form-label">Photography Service</label>
                        <select id="service" name="service" class="form-select">
                            <option value="">Choose a service</option>
                            <option value="family">Family</option>
                            <option value="portrait">Portrait</option>
                            <option value="maternity">Maternity</option>
                            <option value="lifestyle">Lifestyle</option>
                            <option value="wedding">Wedding</option>
                            <option value="headshot">Headshot</option>
                        </select>
                        <p class="error-message" id="service-error"></p>
                    </div>

                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" name="message" class="form-control" rows="6"
                            placeholder="Tell me about your session"></textarea>
                        <p class="error-message" id="message-error"></p>
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn-dark-custom">Send Message</button>
                    </div>
                </div>

                <p id="form-success" class="form-success text-center"></p>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/validation.js"></script>
    <script src="js/components.js"></script>
</body>

</html>
