<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Photography | Kate Shelest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <div id="site-header"></div>

    <!-- Gallery -->
    <main class="container my-5">
        <h1 class="portfolio-title text-center">BRANDING GALLERY</h1>
        <p class="text-center mb-5">
            <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
        </p>

        <div class="row g-3 gallery-grid">
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-1.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-2.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-3.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-4.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-5.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-6.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-7.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-8.webp" alt="Branding session photo" class="gallery-img">
            </div>

            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-9.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-10.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-11.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-12.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-13.webp" alt="Branding session photo" class="gallery-img">
            </div>

            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-14.webp" alt="Branding session photo" class="gallery-img">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/Branding/branding-15.webp" alt="Branding session photo" class="gallery-img">
            </div>
        </div>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Gallery image viewer">
        <!-- Close -->
        <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close image">
            <span aria-hidden="true">&times;</span>
        </button>

        <!-- Previous -->
        <button id="lightbox-prev" class="lightbox-prev" type="button" aria-label="Previous image">
            <span aria-hidden="true">&#10094;</span>
        </button>

        <!-- Enlarged image -->
        <img id="lightbox-img" src="" alt="">

        <!-- Next -->
        <button id="lightbox-next" class="lightbox-next" type="button" aria-label="Next image">
            <span aria-hidden="true">&#10095;</span>
        </button>
    </div>

    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/gallery.js"></script>
    <script src="js/components.js"></script>
</body>

</html>
