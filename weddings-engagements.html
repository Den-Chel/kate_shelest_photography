<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headshot Photography | Kate Shelest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <div id="site-header"></div>

    <!-- Gallery -->
    <main class="container my-5">
        <h1 class="portfolio-title text-center">HEADSHOTS GALLERY</h1>
        <p class="text-center mb-5"><a href="index.html" class="back-link">&larr; Back to Portfolio</a></p>
        <div class="row g-3 gallery-grid">
            <div class="col-6 col-md-4"><img src="images/headshots-1.jpg" alt="Headshot session photo"
                    class="gallery-img"></div>
            <div class="col-6 col-md-4"><img src="images/headshots-2.jpg" alt="Headshot session photo"
                    class="gallery-img"></div>
            <div class="col-6 col-md-4"><img src="images/headshots-3.jpg" alt="Headshot session photo"
                    class="gallery-img"></div>
            <div class="col-6 col-md-4"><img src="images/headshots-4.jpg" alt="Headshot session photo"
                    class="gallery-img"></div>
            <div class="col-6 col-md-4"><img src="images/headshots-5.jpg" alt="Headshot session photo"
                    class="gallery-img"></div>
            <div class="col-6 col-md-4"><img src="images/headshots-6.jpg" alt="Headshot session photo"
                    class="gallery-img"></div>
        </div>
    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span id="lightbox-close" class="lightbox-close">&times;</span>
        <img id="lightbox-img" class="lightbox-content" src="" alt="Enlarged photo">
    </div>

    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/gallery.js"></script>
    <script src="js/components.js"></script>
</body>

</html>
