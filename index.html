<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kate Shelest Photography</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->
    <div id="site-header"></div>

    <!-- Portfolio -->
    <main class="container my-5">
        <h1 class="portfolio-title text-center">PORTFOLIO</h1>

        <div class="row g-4 mt-2">

            <!-- Branding -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="branding.html" class="category-card">
                    <img src="images/branding-cover.webp" alt="Branding photography portfolio" class="category-img">
                    <span class="category-name">Branding</span>
                </a>
            </div>

            <!-- Portrait -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="portrait.html" class="category-card">
                    <img src="images/portrait-cover.webp" alt="Portrait photography portfolio" class="category-img">
                    <span class="category-name">Portrait</span>
                </a>
            </div>

            <!-- Maternity -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="maternity.html" class="category-card">
                    <img src="images/maternity-cover.webp" alt="Maternity photography portfolio" class="category-img">
                    <span class="category-name">Maternity</span>
                </a>
            </div>

            <!-- Birthday Milestones -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="birthday-milestones.html" class="category-card">
                    <img src="images/birthday-milestones-cover.webp" alt="Birthday milestone photography portfolio"
                        class="category-img" loading="lazy" decoding="async">
                    <span class="category-name">
                        Birthday Milestones
                    </span>
                </a>
            </div>

            <!-- Newborn -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="newborn.html" class="category-card">
                    <img src="images/newborn-cover.webp" alt="Newborn photography portfolio" class="category-img"
                        loading="lazy" decoding="async">
                    <span class="category-name">Newborn</span>
                </a>
            </div>

            <!-- Intimate Weddings & Engagements -->
            <div class="col-12 col-md-6 col-lg-4">
                <a href="weddings-engagements.html" class="category-card">

                    <img src="images/intimate-weddings-cover.webp" alt="Weddings and engagements photography portfolio"
                        class="category-img" loading="lazy" decoding="async">

                    <span class="category-name">
                        Intimate Weddings &amp; Engagements
                    </span>

                </a>
            </div>

        </div>

        </div>

    </main>

    <!-- Footer -->
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
</body>

</html>
